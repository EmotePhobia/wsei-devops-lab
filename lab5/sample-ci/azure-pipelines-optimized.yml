name: CI - Optimized

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('lab5/sample-ci/backend/**/*.csproj') }}

      - name: Restore dependencies
        working-directory: lab5/sample-ci/backend
        run: dotnet restore

      - name: Build application
        working-directory: lab5/sample-ci/backend
        run: dotnet build --no-restore --configuration Release

      - name: Run unit tests
        working-directory: lab5/sample-ci/backend
        run: dotnet test --no-build --configuration Release --logger trx

      - name: Publish artifacts
        working-directory: lab5/sample-ci/backend
        run: dotnet publish --no-build --configuration Release --output ./publish

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend
          path: lab5/sample-ci/backend/publish

  frontend:
    name: Frontend (Node.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: lab5/sample-ci/frontend/package-lock.json

      - name: Install dependencies
        working-directory: lab5/sample-ci/frontend
        run: npm ci

      - name: Run tests
        working-directory: lab5/sample-ci/frontend
        run: npm test

      - name: Build frontend
        working-directory: lab5/sample-ci/frontend
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: lab5/sample-ci/frontend/dist
